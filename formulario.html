<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar comida</title>
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    
</head>

<body>

<header class="header">
  <div class="header-left">
    <button
        id="menu-toggle"
        aria-label="Abrir menú">

        ☰

    </button>
    <h1 id="form-title">Agregar comida</h1>
    <!-- Boton para dark mode, agregado por JP-->
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">

      🌙
    </button>
  </div>
</header>

<nav class="side-menu" id="side-menu">
  <a href="index.html">Inicio</a>
  <a href="planner1.html">Planificador</a>
  <a href="compras.html">Compras</a>
  <a href="recetas.html">Recetas</a>
</nav>

<main class="container">
    <!-- Boton de volver al planner, agregado por JP-->
    <button
        type="button"
        class="btn secondary back-btn"
        onclick="history.back()">

        ← Volver

    </button>
    <form id="mealForm" class="form-container">

        <!-- Nombre -->
        <div class="form-group">
        <label for="nombre">Nombre de la comida</label>
            <input type="text" id="nombre">
            <span class="error">Campo obligatorio</span>
        </div>

        <!-- Día --> 
        <div class="form-group"> 
            <label for="dia">"Día</label> 
            <select id="dia"> 
                <option value="">Seleccionar</option> 
                <option value="lunes">Lunes</option> 
                <option value="martes">Martes</option> 
                <option value="miercoles">Miércoles</option> 
                <option value="jueves">Jueves</option> 
                <option value="viernes">Viernes</option> 
                <option value="sabado">Sábado</option> 
                <option value="domingo">Domingo</option> 
            </select> 
            <span class="error">Seleccioná un día</span> 
        </div>

        <!-- Tipo -->
        <div class="form-group"> 
            <label for="tipo">Tipo</label> 
            <select id="tipo"> 
                <option value="">Seleccionar</option> 
                <option value="Desayuno">Desayuno</option> 
                <option value="Almuerzo">Almuerzo</option> 
                <option value="Cena">Cena</option> 
            </select> 
            <span class="error">Seleccioná un tipo</span> 
        </div>

        <!-- Ingredientes -->
        <div class = "form-group">
            <label for="ingredientes">Ingredientes (separados por coma)</label>
            <input type="text" id="ingredientes">
            <span class="error">Ingresá al menos un ingrediente</span>
        </div>

        <!--Pasos de la receta Joaquin: Agrege los pasos para la recetas-->
        <div class = "form-group">
            <label for="pasos">Pasos</label>
            <textarea id="recipe-steps"></textarea>
        </div>

        <!-- Checkbox Joaquin: Agrege esto para tener mas opciones en las checkboxes -->
        <div class="form-group">
            <label>
                <input type="checkbox" id="vegetariano">Vegetariano
            </label>

            <label>
                <input type="checkbox" id="vegano">Vegano
            </label>

            <label>
                <input type="checkbox" id="sin-tacc">Sin TACC
            </label>
        </div>

        <!-- Radio -->
        <div class="form-group">
            <label for="dificultad">Dificultad</label>

            <label><input type="radio" name="dif" value="facil">Fácil</label>
            <label><input type="radio" name="dif" value="media">Media</label>
            <label><input type="radio" name="dif" value="dificil">Difícil</label>
                
            <span class="error">Seleccioná dificultad</span>
        </div>

        <button class="btn primary" type="submit">Guardar</button>
        <button class="btn btn-modal-loaded-recipes" type="button">Ver recetas →</button>
    </form>

    <!-- MODAL RECETAS -->
    <article class="modal-loaded-recipes" id="modal-loaded-recipes">

        <button class="btn" id="close-loaded-recipes" type="button">X</button>
        <h2>Recetas disponibles</h2>
        <div id="loaded-recipes-container"></div>

    </article>
    
</main>

<nav class="bottom-nav">
    <a href="index.html">Inicio</a>
    <a href="planner1.html">Planificador</a>
    <a href="compras.html">Compras</a>
    <a href="recetas.html">Recetas</a>
</nav>

<script src="js/storage.js"></script>
<script src="js/formulario.js" defer></script>
<script src="js/recipes.js" defer></script>
<script src="js/main.js"></script>
</body>

</html>
