<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">
  <div class="header-left">
    <button
      id="menu-toggle"
      aria-label="Abrir menú">

      ☰

    </button>
    <h1>Inicio</h1>
  <!-- Boton para dark mode, agregado por JP-->
      <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">

      🌙
    </button>
  </div>
</header>

<nav class="side-menu" id="side-menu">
  <a href="index.html">Inicio</a>
  <a href="planner1.html">Planificador</a>
  <a href="compras.html">Compras</a>
  <a href="recetas.html">Recetas</a>
</nav>

<main class="container">

  <section class="greeting">
    <h1 id="day-title"><h1>

  </section>

  <section class="actions">
    <button class="btn primary">+ Añadir comida</button>
  </section>

  <section class="nutrition">

    <div class="nutrition-header">
      <br><h3>Características del día</h3>
    </div>

    <div class="nutrition-grid">

      <div class="circle">
        <span id="total-meals">0</span>
        <small>comida/s</small>
      </div>
      <br>
      <div class="bar">
        <p></p>
        <div class="progress">
          <div id="veg-bar"></div>
        </div>
      </div>

      <div class="bar">
        <p></p>
        <div class="progress">
          <div id="vegan-bar"></div>
        </div>
      </div>

      <div class="bar">
        <p></p>
        <div class="progress">
          <div id="tacc-bar"></div>
        </div>
      </div>

    </div>
  </section>

  <section class="meals">
    <div class="section-header">
      <br><h3>Comidas del día</h3>
    </div>

    <div class="meal-card">
      <!-- <img src="https://via.placeholder.com/150" alt=""> -->
      <div class="meal-info">
        <h4>Comida 1</h4>
        <p>15 min • 380 kcal</p>
      </div>
    </div>

    <div class="meal-card">
      <!-- <img src="https://via.placeholder.com/150" alt=""> -->
      <div class="meal-info">
        <h4>Comida 2</h4>
        <p>20 min • 450 kcal</p>
      </div>
    </div>

    <div class="meal-card">
      <!-- <img src="https://via.placeholder.com/150" alt=""> -->
      <div class="meal-info">
        <h4>Comida 3</h4>
        <p>25 min • 520 kcal</p>
      </div>
    </div>

  </section>

</main>

<nav class="bottom-nav">

</nav>

<script src="js/main.js"></script>

</body>
</html>
