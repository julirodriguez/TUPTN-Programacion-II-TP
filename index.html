<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">
  <div class="header-left">
    <button id="menu-toggle">☰</button>
    <h1>Inicio</h1>
  <!-- Boton para dark mode, agregado por JP-->
    <button id="theme-toggle" class="theme-toggle">
      🌙
    </button>
  </div>
</header>

<nav class="side-menu" id="side-menu">
  <a href="index.html">Inicio</a>
  <a href="planner1.html">Planificador</a>
  <a href="compras.html">Compras</a>
  <a href="recetas.html">Recetas</a>
</nav>

<main class="container">

  <section class="greeting">
    <p class="date">Martes</p>
    <h2>Texto</h2>
    <p>Texto</p>
  </section>

  <section class="actions">
    <button class="btn primary">+ Añadir comida</button>
  </section>

  <section class="nutrition">
    <div class="nutrition-header">
      <h3>Porcentaje</h3>
      <span>75%</span>
    </div>

    <div class="nutrition-grid">
      <div class="circle">
        <span>1450</span>
        <small>kcal</small>
      </div>

      <div class="bar">
        <p>Proteina</p>
        <div class="progress"><div style="width:68%"></div></div>
      </div>

      <div class="bar">
        <p>Carbohidratos</p>
        <div class="progress"><div style="width:72%"></div></div>
      </div>

      <div class="bar">
        <p>Grasas</p>
        <div class="progress"><div style="width:64%"></div></div>
      </div>
    </div>
  </section>

  <section class="meals">
    <div class="section-header">
      <h3>Comidas del día</h3>
    </div>

    <div class="meal-card">
      <img src="https://via.placeholder.com/150" alt="">
      <div class="meal-info">
        <h4>Comida 1</h4>
        <p>15 min • 380 kcal</p>
      </div>
    </div>

    <div class="meal-card">
      <img src="https://via.placeholder.com/150" alt="">
      <div class="meal-info">
        <h4>Comida 2</h4>
        <p>20 min • 450 kcal</p>
      </div>
    </div>

    <div class="meal-card">
      <img src="https://via.placeholder.com/150" alt="">
      <div class="meal-info">
        <h4>Comida 3</h4>
        <p>25 min • 520 kcal</p>
      </div>
    </div>

  </section>

</main>

<nav class="bottom-nav">
  <a class="active">Inicio</a>
  <a href="planner1.html">Planificador</a>
  <a href="compras.html">Compras</a>
  <a href="recetas.html">Recetas</a>
</nav>

<script src="js/main.js"></script>

</body>
</html>
